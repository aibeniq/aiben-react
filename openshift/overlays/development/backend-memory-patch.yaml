---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              memory: "6Gi"    # Increased from 6Gi to 10Gi
              cpu: "1000m"
            limits:
              memory: "8Gi"    # Increased from 8Gi to 12Gi for ML installations
              cpu: "2000m"      # Increased from 1000m for faster installation
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              memory: "10Gi"    # Increased from 6Gi to 10Gi
              cpu: "1000m"
            limits:
              memory: "8Gi"    # Increased from 8Gi to 12Gi for ML installations
              cpu: "2000m"      # Increased from 1000m for faster installation
              memory: "6Gi"    # Increased from 6Gi to 10Gi
              cpu: "1000m"
            limits:
              memory: "8Gi"    # Increased from 8Gi to 12Gi for ML installations
              cpu: "2000m"      # Increased from 1000m for faster installation
