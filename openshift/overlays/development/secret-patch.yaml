apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # SECURITY NOTICE: DO NOT COMMIT REAL SECRETS TO GIT
  # This file is a TEMPLATE. Replace placeholder values manually with:
  # 1. oc patch secret backend-secrets --type=merge -p='{"stringData":{"OPENAI_API_KEY":"sk-dev-key"}}'
  # 2. Or use the apply-secrets-secure.ps1 script with interactive prompts

  # Development-specific overrides (use placeholders, inject real values at runtime)
  SECRET_KEY: "REPLACE_ME_DEV_SECRET_KEY"
  FIRST_SUPERUSER: "dev-admin@example.com"
  FIRST_SUPERUSER_PASSWORD: "REPLACE_ME_DEV_SUPERUSER_PWD"
  POSTGRES_PASSWORD: "REPLACE_ME_DEV_DB_PWD"
  OPENAI_API_KEY: "REPLACE_ME_DEV_OPENAI_KEY"
  REPLICATE_API_TOKEN: "REPLACE_ME_DEV_REPLICATE_TOKEN"

  # Development email config (can be less restrictive)
  EMAILS_FROM_EMAIL: "dev-noreply@example.com"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_USER: "dev@example.com"
  SMTP_PASSWORD: "REPLACE_ME_DEV_SMTP_PWD"
