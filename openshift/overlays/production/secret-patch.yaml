apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # SECURITY NOTICE: DO NOT COMMIT REAL SECRETS TO GIT
  # This file is a TEMPLATE. Replace placeholder values manually with:
  # 1. oc patch secret backend-secrets --type=merge -p='{"stringData":{"OPENAI_API_KEY":"sk-real-key"}}'
  # 2. Or use the apply-secrets-secure.ps1 script with interactive prompts

  # Environment-specific overrides (use placeholders, inject real values at runtime)
  SECRET_KEY: "REPLACE_ME_PROD_SECRET_KEY"
  FIRST_SUPERUSER: "admin@yourdomain.com"
  FIRST_SUPERUSER_PASSWORD: "REPLACE_ME_PROD_SUPERUSER_PWD"
  # IMPORTANT: This password MUST match the value in the postgres-secret (POSTGRES_PASSWORD).
  # Use a single placeholder so accidental mismatches don't break startup. Patch both secrets at runtime with the real value.
  POSTGRES_PASSWORD: "REPLACE_ME_DB_PWD"
  OPENAI_API_KEY: "REPLACE_ME_PROD_OPENAI_KEY"
  REPLICATE_API_TOKEN: "REPLACE_ME_PROD_REPLICATE_TOKEN"
  AWS_ACCESS_KEY_ID: "REPLACE_ME_PROD_AWS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME_PROD_AWS_SECRET"

  # Production email config (semi-sensitive)
  EMAILS_FROM_EMAIL: "noreply@yourdomain.com"
  SMTP_HOST: "smtp.yourdomain.com"
  SMTP_USER: "noreply@yourdomain.com"
  SMTP_PASSWORD: "REPLACE_ME_PROD_SMTP_PWD"
