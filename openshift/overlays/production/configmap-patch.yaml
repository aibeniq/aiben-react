apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  ENVIRONMENT: "production"
  PROJECT_NAME: "AibenIQ"
  STACK_NAME: "aibeniq"
  FRONTEND_HOST: "https://redhat.aiben.io"
  BACKEND_CORS_ORIGINS: "https://redhat.aiben.io,https://redhat-api.aiben.io,http://redhat.aiben.io,http://redhat-api.aiben.io,http://localhost:5173"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "app"
  POSTGRES_USER: "app"
  API_V1_STR: "/api/v1"
  ACCESS_TOKEN_EXPIRE_MINUTES: "11520"
  FULL_SCAN_DOCUMENT_CHUNK_SIZE: "100000"
  FULL_SCAN_DOCUMENT_CHUNK_OVERLAP: "200"
  RAG_DOCUMENT_CHUNK_SIZE: "1000"
  RAG_DOCUMENT_CHUNK_OVERLAP: "200"
  DEFAULT_LLM_MODEL: "gpt-4o-mini"
  ENABLED_PROVIDERS: "openai"
  OLLAMA_BASE_URL: "http://ollama:11434"
  AWS_REGION: "eu-north-1"
  # Production defaults to lean deployment (overridden by deployment script)
  ENABLE_PYTORCH: "false"
  RUNTIME_INSTALL_PYTORCH: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  VITE_API_URL: "https://redhat-api.aiben.io"
