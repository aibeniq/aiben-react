apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: aibeniq-production

resources:
  - ../../base

namespace: aibeniq-prod

patchesStrategicMerge:
  - domain-config-patch.yaml
  - configmap-patch.yaml
  - backend-patch.yaml
  - frontend-patch.yaml
  - postgres-patch.yaml
  - route-patches.yaml
  - internal-registry-patches.yaml
  - frontend-permissions-patch.yaml
  - traefik-permissions-patch.yaml
  - adminer-permissions-patch.yaml

commonLabels:
  environment: production

images:
  - name: quay.io/aibeniq/backend
    newTag: v1.0.0
  - name: quay.io/aibeniq/frontend
    newTag: v1.0.0
