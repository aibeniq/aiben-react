apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: aibeniq
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibeniq
      component: frontend
  template:
    metadata:
      labels:
        app: aibeniq
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        #runAsUser: 1000
        #fsGroup: 1000
      containers:
        - name: frontend
          image: default-route-openshift-image-registry.apps.aibeniq-prod.gimc.p1.openshiftapps.com/aibeniq-prod/frontend:latest
          ports:
            - containerPort: 8080
              name: http
          # ENTRYPOINT handles runtime injection of VITE_API_URL; no command override needed
          env:
            - name: NGINX_USER
              value: "nginx"
            - name: VITE_API_URL
              value: "https://redhat-api.aiben.io"
          envFrom:
            - configMapRef:
                name: frontend-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: aibeniq
    component: frontend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: aibeniq
    component: frontend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend-dashboard
  labels:
    app: aibeniq
    component: frontend
spec:
  host: redhat.aiben.io
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
