apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: aibeniq
    component: backend
data:
  ENVIRONMENT: "production"
  PROJECT_NAME: "AibenIQ"
  STACK_NAME: "aibeniq"
  FRONTEND_HOST: "https://redhat.aiben.io"
  # Allow both custom domain and potential fallback cluster domains for CORS
  BACKEND_CORS_ORIGINS: "https://redhat.aiben.io,https://redhat-api.aiben.io,http://redhat.aiben.io,http://redhat-api.aiben.io,http://localhost:5173"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aibeniq"
  POSTGRES_USER: "app"
  REDIS_URL: "redis://redis:6379"
  API_V1_STR: "/api/v1"
  ACCESS_TOKEN_EXPIRE_MINUTES: "11520"
  FULL_SCAN_DOCUMENT_CHUNK_SIZE: "100000"
  FULL_SCAN_DOCUMENT_CHUNK_OVERLAP: "200"
  RAG_DOCUMENT_CHUNK_SIZE: "1000"
  RAG_DOCUMENT_CHUNK_OVERLAP: "200"
  DEFAULT_LLM_MODEL: "gpt-4o-mini"
  ENABLED_PROVIDERS: "openai"
  OLLAMA_BASE_URL: "http://ollama:11434"
  AWS_REGION: "eu-north-1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: aibeniq
    component: frontend
data:
  VITE_API_URL: "https://redhat-api.aiben.io"
