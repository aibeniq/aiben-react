apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: aibeniq
    component: backend
data:
  ENVIRONMENT: "staging"
  PROJECT_NAME: "AibenIQ"
  STACK_NAME: "aibeniq"
  BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:5173,https://dashboard.yourdomain.com"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "app"
  POSTGRES_USER: "app"
  API_V1_STR: "/api/v1"
  ACCESS_TOKEN_EXPIRE_MINUTES: "11520"
  FULL_SCAN_DOCUMENT_CHUNK_SIZE: "100000"
  FULL_SCAN_DOCUMENT_CHUNK_OVERLAP: "200"
  RAG_DOCUMENT_CHUNK_SIZE: "1000"
  RAG_DOCUMENT_CHUNK_OVERLAP: "200"
  DEFAULT_LLM_MODEL: "gpt-4o-mini"
  ENABLED_PROVIDERS: "openai"
  OLLAMA_BASE_URL: "http://ollama:11434"
  AWS_REGION: "eu-north-1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: aibeniq
    component: frontend
data:
  VITE_API_URL: "https://api.yourdomain.com"
