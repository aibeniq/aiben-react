apiVersion: v1
kind: ConfigMap
metadata:
  name: domain-config
  labels:
    app: aibeniq
    component: config
data:
  # Base domain for all environments
  BASE_DOMAIN: "aiben.io"
  # Default environment (production); development overlay will override
  ENVIRONMENT: "production"

  # Service URLs for production environment
  FRONTEND_URL: "redhat.aiben.io"
  API_URL: "redhat-api.aiben.io"
  TRAEFIK_URL: "redhat-traefik.aiben.io"
  ADMINER_URL: "redhat-adminer.aiben.io"
