apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: aibeniq
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibeniq
      component: backend
  template:
    metadata:
      labels:
        app: aibeniq
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        #runAsUser: 1000
        #fsGroup: 1000
      containers:
        - name: backend
          # Use internal image registry service reference for reliability inside cluster
          image: image-registry.openshift-image-registry.svc:5000/aibeniq-prod/backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          # CORS origins now sourced solely from ConfigMap (backend-config) to avoid drift.
          livenessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done;",
            ]
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            [
              "sh",
              "-c",
              "until redis-cli -h redis -p 6379 ping; do echo waiting for redis; sleep 2; done;",
            ]
        - name: run-prestart
          image: image-registry.openshift-image-registry.svc:5000/aibeniq-prod/backend:latest
          command:
            [
              "bash",
              "-c",
              "echo '[init] Running prestart script (migrations & seed)...'; if [ -f scripts/prestart.sh ]; then bash scripts/prestart.sh; elif [ -f /app/scripts/prestart.sh ]; then bash /app/scripts/prestart.sh; else echo 'prestart.sh not found'; fi; echo '[init] Prestart complete.'",
            ]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: aibeniq
    component: backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: aibeniq
    component: backend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend-api
  labels:
    app: aibeniq
    component: backend
spec:
  host: redhat-api.aiben.io
  to:
    kind: Service
    name: backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
