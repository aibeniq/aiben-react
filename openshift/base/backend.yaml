apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: aibeniq
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aibeniq
      component: backend
  template:
    metadata:
      labels:
        app: aibeniq
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: quay.io/aibeniq/backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done;",
            ]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: aibeniq
    component: backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: aibeniq
    component: backend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend-api
  labels:
    app: aibeniq
    component: backend
spec:
  host: api.yourdomain.com
  to:
    kind: Service
    name: backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
