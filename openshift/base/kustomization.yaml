apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: aibeniq-base

resources:
  - domain-config.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - traefik.yaml
  - adminer.yaml
  - ollama.yaml

commonLabels:
  app: aibeniq
  version: v1
  environment: production # Using commonLabels for compatibility with current kustomize version bundled in oc

images:
  - name: quay.io/aibeniq/backend
    newTag: latest
  - name: quay.io/aibeniq/frontend
    newTag: latest
