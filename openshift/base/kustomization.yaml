apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: aibeniq-base

resources:
  - domain-config.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - adminer.yaml
  - ollama.yaml

commonLabels:
  app: aibeniq
  version: v1
  environment: production # Using commonLabels for compatibility with current kustomize version bundled in oc

images:
  - name: default-route-openshift-image-registry.apps.aibeniq-prod.gimc.p1.openshiftapps.com/aibeniq-prod/backend
    newTag: latest
  - name: default-route-openshift-image-registry.apps.aibeniq-prod.gimc.p1.openshiftapps.com/aibeniq-prod/frontend
    newTag: latest
