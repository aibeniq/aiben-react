apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: aibeniq-base

resources:
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - prestart-job.yaml

commonLabels:
  app: aibeniq
  version: v1

images:
  - name: quay.io/aibeniq/backend
    newTag: latest
  - name: quay.io/aibeniq/frontend
    newTag: latest
