services:
  db:
    image: postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`recq-adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    build:
      context: ./backend
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      #- DOMAIN=${DOMAIN}
      #- FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      #- ENVIRONMENT=${ENVIRONMENT}
      #- BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      #- SECRET_KEY=${SECRET_KEY?Variable not set}
      #- FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      #- FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      #- SMTP_HOST=${SMTP_HOST}
      #- SMTP_USER=${SMTP_USER}
      #- SMTP_PASSWORD=${SMTP_PASSWORD}
      #- EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      #- POSTGRES_PORT=${POSTGRES_PORT}
      #- POSTGRES_DB=${POSTGRES_DB}
      #- POSTGRES_USER=${POSTGRES_USER?Variable not set}
      #- POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      #- SENTRY_DSN=${SENTRY_DSN}
      #- AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      #- AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      #- OPENAI_API_KEY=${OPENAI_API_KEY}
      #- OPENAI_ADMIN_KEY=${OPENAI_ADMIN_KEY}
      #- REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}

  backend:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    restart: always
    networks:
      - traefik-public
      - default
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      #ollama:
      #  condition: service_healthy
    env_file:
      - .env
    environment:
      #- DOMAIN=${DOMAIN}
      #- FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      #- ENVIRONMENT=${ENVIRONMENT}
      #- BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      #- SECRET_KEY=${SECRET_KEY?Variable not set}
      #- FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      #- FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      #- SMTP_HOST=${SMTP_HOST}
      #- SMTP_USER=${SMTP_USER}
      #- SMTP_PASSWORD=${SMTP_PASSWORD}
      #- EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      #- POSTGRES_PORT=${POSTGRES_PORT}
      #- POSTGRES_DB=${POSTGRES_DB}
      #- POSTGRES_USER=${POSTGRES_USER?Variable not set}
      #- POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      #- SENTRY_DSN=${SENTRY_DSN}
      #- AWS_ACCESS_KEY_ID
      #- AWS_SECRET_ACCESS_KEY
      #- OPENAI_API_KEY=${OPENAI_API_KEY}
      #- REPLICATE_API_TOKEN

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: ./backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`recq-api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http
      #- traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=${STACK_NAME?Variable not set}-auth

  frontend:
    #profiles: ["frontend"]
    image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}"
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://recq-api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-auth.basicauth.users=${USERNAME?Variable not set}:${HASHED_PASSWORD?Variable not set}

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`recq.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=${STACK_NAME?Variable not set}-auth

  ollama-init:
    profiles: ["ollama"]
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./backend/app/ollama:/app/ollama
    command: python /app/ollama/init_ollama_models.py
    networks:
      - default

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - default
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c '</dev/tcp/localhost/11434' || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-db-data:
  #ollama-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
