server {
    listen 80;

    # Increase timeouts and limits for large file uploads
    client_max_body_size 1000M;         # Allow large file uploads up to 1GB
    client_body_timeout 3600s;           # 5 minutes for client to send body
    client_header_timeout 60s;          # 1 minute for client to send headers
    client_body_buffer_size 128k;       # Buffer size for reading client request body
    send_timeout 3600s;                  # 5 minutes for response timeout
    
    # Keep alive settings
    keepalive_timeout 300s;
    keepalive_requests 1000;
    
    # Proxy settings for API calls to backend
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;            # 5 minutes to send to backend
    proxy_read_timeout 3600s;            # 5 minutes to read from backend
    proxy_buffering off;                # Disable buffering for large uploads
    proxy_request_buffering off;        # Don't buffer the request body
    
    # Additional proxy buffer settings
    proxy_buffer_size 64k;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;         # Disable temp files for large uploads

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html =404;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Include the backend not found configuration
    include /etc/nginx/extra-conf.d/*.conf;
}