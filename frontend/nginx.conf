server {
  listen 80;

  # Increase timeouts for large file uploads
  client_max_body_size 1000M;  # Allow large file uploads up to 1GB
  client_body_timeout 3600;    # 60 minutes for client to send body
  client_header_timeout 3600;  # 60 minutes for client to send headers
  send_timeout 3600;           # 60 minutes for response timeout

  # Password protection for all routes
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  # Password protection removed from nginx: Traefik will handle HTTP Basic Auth via middleware
  # auth_basic "Restricted";
  # auth_basic_user_file /usr/share/nginx/html/.htpasswd;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}