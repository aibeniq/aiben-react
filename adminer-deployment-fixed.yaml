apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-fixed
  namespace: aibeniq-prod
  labels:
    app: aibeniq
    component: adminer
    environment: production
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibeniq
      component: adminer-fixed
      environment: production
      version: v1
  template:
    metadata:
      labels:
        app: aibeniq
        component: adminer-fixed
        environment: production
        version: v1
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
            - name: ADMINER_DESIGN
              value: pepa-linha
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          # No volume mounts that would overwrite adminer files
