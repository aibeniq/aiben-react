name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.4.15"
          enable-cache: true
      - name: Copy .env.example to .env and set test-specific values
        run: |
          cp .env.example .env
          # Mock API keys to prevent validation errors
          echo "OPENAI_API_KEY=test-key" >> .env
          echo "AWS_ACCESS_KEY_ID=test-access-key" >> .env
          echo "AWS_SECRET_ACCESS_KEY=test-secret-key" >> .env
          echo "AWS_REGION=us-east-1" >> .env
          echo "MILVUS_URL=http://localhost:19530" >> .env
        env:
          OPENAI_API_KEY: test-key
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_REGION: us-east-1
          MILVUS_URL: http://localhost:19530
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db mailcatcher milvus-etcd milvus-minio milvus
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
        env:
          OPENAI_API_KEY: test-key
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_REGION: us-east-1
          MILVUS_URL: http://localhost:19530
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
        env:
          OPENAI_API_KEY: test-key
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_REGION: us-east-1
          MILVUS_URL: http://localhost:19530
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
