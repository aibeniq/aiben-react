[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    # David adding in genAI-related packages
    "langchain-community==0.3.19",
    "langchain-text-splitters==0.3.6",
    #"langchain-huggingface==0.2.0", MADE OPTIONAL
    "chromadb==1.0.9",
    "openai==1.95.1",
    "pymupdf==1.25.5",
    "pypdf==5.4.0",
    "langchain-openai==0.3.17",
    "python-docx>=0.8.11,<1.0.0",
    "replicate==1.0.6",
    "markdown == 3.5.2",
    "beautifulsoup4 == 4.12.2",
    "langchain-aws==0.2.24",
    "pymilvus>=2.5.11",
    "rank_bm25==0.2.2",
]

[project.optional-dependencies]
huggingface = [
    "langchain-huggingface==0.2.0"
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "types-requests>=2.32.4.20250611",
    "types-markdown>=3.8.0.20250708",
    "black>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

# Ignore missing stubs for libraries that don't have them
[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "docx.*",
    "bs4.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]
# Make ruff compatible with black
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "W293",  # blank line contains whitespace
    "W291",  # trailing whitespace
    "I001",  # organize imports
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.black]
line-length = 88
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | alembic
)/
'''
