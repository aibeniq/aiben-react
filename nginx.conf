# Nginx config to protect both frontend and backend with HTTP Basic Auth

# Place your .htpasswd file somewhere secure, e.g. /etc/nginx/.htpasswd
# To generate: htpasswd -c /etc/nginx/.htpasswd demo
# Example credentials: demo / password123

server {
    listen 80;
    server_name _;

    # Enable HTTP Basic Auth for all locations
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Proxy frontend (React, etc.)
    location / {
        proxy_pass http://frontend:3000;  # Change to your frontend container/service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy backend API
    location /api/ {
        proxy_pass http://backend:8000;   # Change to your backend container/service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
