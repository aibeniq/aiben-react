# Nginx configuration for handling large knowledge base uploads on EC2
# Place this in your nginx site configuration file (e.g., /etc/nginx/sites-available/your-app)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # Replace with your actual domain

    # Increase file upload limits for large knowledge base uploads
    client_max_body_size 1000M;          # Allow up to 1GB uploads
    client_body_timeout 300s;            # 5 minutes for body read
    client_header_timeout 60s;
    client_body_buffer_size 128k;
    
    # Keep alive settings
    keepalive_timeout 300s;
    keepalive_requests 1000;
    
    # Proxy timeouts for backend communication
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;             # 5 minutes to send to backend
    proxy_read_timeout 300s;             # 5 minutes to read from backend
    proxy_buffering off;                 # Disable buffering for large uploads
    
    # Additional proxy settings
    proxy_buffer_size 64k;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;
    
    # Frontend static files
    location / {
        root /path/to/your/frontend/build;  # Replace with your actual frontend path
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API routes - backend proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;  # Replace with your backend URL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API-specific timeouts (important for large uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Handle large uploads efficiently
        proxy_max_temp_file_size 0;
    }
    
    # WebSocket support (if needed)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

